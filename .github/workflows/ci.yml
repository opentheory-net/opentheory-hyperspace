name: Static site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The site is already static HTML: no packages, build, upload or secrets.
      - name: Validate site and Pages security policy
        run: python3 -B -m unittest discover -s tests -v
